server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # health endpoint
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Application data is served as a static JSON file, NOT baked into the
    # frontend build. Private/incognito windows receive the same server
    # config. Must never be cached; changes require only a reload.
    location = /config.json {
        access_log off;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Static assets are served as-is; unknown paths fall back to index.html.
    # The app itself performs no client-side routing that mutates the URL,
    # so the fallback only exists for robustness.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived immutable assets from Vite build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}