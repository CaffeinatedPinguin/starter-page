# Applies a label based on the PR title (Conventional Commits) -> release-notes categories.
# It does not check out or run any code from the PR. Works only for PRs from this repository's branches.
name: pr-labels

on:
  pull_request:
    types: [opened, edited, reopened]

permissions: {}

jobs:
  label:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Map title -> label
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.pull_request.title }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          type="${TITLE%%[(:!]*}"
          case "$type" in
            feat)          want=enhancement ;;
            fix)           want=bug ;;
            docs)          want=docs ;;
            perf|revert)   want=enhancement ;;
            *)             want=skip-changelog ;;
          esac
          # Security fix: a title like "fix(security): ..." -> security
          [[ "$TITLE" =~ ^fix\(security\) ]] && want=security
          labels=("$want")
          [[ "$TITLE" =~ ^[a-z]+(\([^\)]*\))?!: ]] && labels+=(breaking)
          for l in enhancement bug docs security skip-changelog breaking; do
            keep=0; for w in "${labels[@]}"; do [[ $l == "$w" ]] && keep=1; done
            (( keep )) || gh api -X DELETE "repos/$REPO/issues/$PR/labels/$l" --silent 2>/dev/null || true
          done
          for l in "${labels[@]}"; do
            gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$l" --silent
          done
