name: ci

# Validate that everything builds on main: the single starter-page
# implementation plus both deployment forms (addon package, Docker image).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Shared SHA-based concurrency group with release.yml. The point is that a
# release tag pushed for the same commit supersedes the CI build: the release
# workflow opts into cancel-in-progress and cancels this run. CI itself does
# NOT opt in, so a later CI run can never cancel an active release.
concurrency:
  group: starter-page-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Cheap guard for the race where the release tag already points at this
  # commit before CI starts evaluating. When it does, the release pipeline is
  # authoritative and the expensive CI jobs are skipped.
  guard:
    name: starter-page / release-tag guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Skip CI when a stable release tag points at this commit
        id: check
        shell: bash
        run: |
          set -euo pipefail
          tag="$(git tag --points-at "$GITHUB_SHA" --list 'v*' --sort=-version:refname \
            | sed -n -E '/^v[0-9]+\.[0-9]+\.[0-9]+$/ {p;q;}')"
          if [[ -n "$tag" ]]; then
            echo "Stable release tag ${tag} already points at ${GITHUB_SHA}; the release pipeline is authoritative. Skipping CI build."
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  starter-page:
    name: starter-page / build and test
    needs: guard
    if: needs.guard.outputs.is_release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-starter-page-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-starter-page-${{ runner.os }}-

      - name: Enable corepack
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@12.2.1 --activate

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm install --frozen-lockfile

      - name: Test
        shell: bash
        run: corepack pnpm test

      - name: Lint
        shell: bash
        run: corepack pnpm lint

      - name: Build
        shell: bash
        run: corepack pnpm build

      - name: Upload shared frontend build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: starter-page-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

      # Canonical addon packaging + validation (scripts/build.mjs): manifest v3,
      # New Tab override, storage permission, version sync with package.json,
      # required runtime files, and no web-only runtime config. Reuses the shared
      # dist/ build instead of duplicating validation in bash.
      - name: Package and validate addon
        shell: bash
        run: corepack pnpm build:addon

  docker:
    name: starter-page / docker build
    needs: [guard, starter-page]
    if: needs.guard.outputs.is_release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download shared frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: starter-page-dist
          path: dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image without publishing (reuses the shared build)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: runtime-prebuild
          pull: true
          push: false
          load: true
          tags: local/starter-page:ci
          cache-from: type=gha,scope=docker-${{ github.repository }}-starter-page
          cache-to: type=gha,scope=docker-${{ github.repository }}-starter-page,mode=max
          provenance: false
          sbom: false

      - name: Smoke test served image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -d -p 18080:8080 --name starter-page-smoke local/starter-page:ci
          trap 'docker rm -f starter-page-smoke >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if docker exec starter-page-smoke wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          root="$(docker exec starter-page-smoke wget -qO- http://127.0.0.1:8080/)"
          grep -q '<div id="root">' <<<"$root"

          config="$(docker exec starter-page-smoke wget -qO- http://127.0.0.1:8080/config.json)"
          grep -q '"defaultPage"' <<<"$config"
          grep -q '"links"' <<<"$config"
