name: Task (maintainer)
description: Internal work item for the maintainer.
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One or two sentences – why this matters.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checkable acceptance criteria.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Out of scope / links (optional)
